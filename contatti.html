<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Scrivici — CarPractice</title><meta name="description" content="Contatta il team CarPractice dalla pagina del sito."><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="cp-header.css"><script defer src="cp-header.js"></script><style>
.contact-page{min-height:calc(100vh - 112px);padding:80px 20px;background:radial-gradient(circle at 75% 15%,rgba(255,122,26,.11),transparent 34rem),#0b0c0d}.contact-layout{max-width:1050px;margin:auto;display:grid;grid-template-columns:.8fr 1.2fr;gap:35px}.contact-intro h1{font-size:clamp(42px,5vw,72px);line-height:1.02;margin:18px 0}.contact-intro p{color:#b5aea9;font-size:18px;line-height:1.6}.contact-card{background:#111213;border:1px solid #39302a;border-radius:24px;padding:32px;display:grid;gap:18px}.contact-field{display:grid;gap:8px;color:#eee;font-size:15px}.contact-field input,.contact-field textarea{font:inherit;width:100%;box-sizing:border-box;border:1px solid #48413b;background:#0b0c0d;color:#fff;border-radius:12px;padding:13px}.contact-field textarea{min-height:155px;resize:vertical}.contact-field input:focus,.contact-field textarea:focus{outline:2px solid #ff7a1a}.contact-privacy{display:flex;gap:10px;align-items:start;font-size:14px;color:#b5aea9}.contact-submit{border:0;border-radius:13px;background:#ff8b31;color:#18100c;padding:16px;font:inherit;font-weight:800;cursor:pointer}.contact-submit:disabled{opacity:.55}.contact-result{display:none;padding:14px;border-radius:10px}.contact-result.ok{display:block;background:#153122;color:#a5efc4}.contact-result.err{display:block;background:#3b1818;color:#ffc3c3}.hp{position:absolute;left:-10000px}@media(max-width:800px){.contact-page{padding-top:40px}.contact-layout{grid-template-columns:1fr}.contact-card{padding:22px}}
</style></head><body><header class="cp-header"><a class="cp-brand" href="index.html"><img src="logo-carpractice-crop.png" alt="CarPractice"><small>DIGITAL REPAIR PLATFORM</small></a><nav class="cp-nav" id="cpNav"></nav><div class="cp-actions"><a class="cp-login" href="https://app.carpractice.it/accesso">♙ <span>Accedi</span></a><a class="cp-trial" href="prova.html">Prova gratis<small>72 ore</small></a><button class="cp-menu-toggle" id="cpMenuToggle" aria-label="Apri menu">☰</button></div></header><main class="contact-page"><div class="contact-layout"><div class="contact-intro"><p class="section-kicker left">CONTATTI</p><h1>Parliamo della tua carrozzeria.</h1><p>Hai una domanda su CarPractice? Scrivici qui: il messaggio arriverà direttamente al nostro team.</p><p>Vuoi provarlo? <a href="prova.html" style="color:#ff9d55">Richiedi la prova gratuita di 72 ore</a>.</p></div><form class="contact-card" id="contactForm"><label class="contact-field">Nome e cognome *<input name="name" autocomplete="name" required maxlength="120"></label><label class="contact-field">Carrozzeria (facoltativa)<input name="business" autocomplete="organization" maxlength="160"></label><label class="contact-field">Email *<input name="email" type="email" autocomplete="email" required maxlength="180"></label><label class="contact-field">Telefono (facoltativo)<input name="phone" type="tel" autocomplete="tel" maxlength="60"></label><label class="contact-field">Messaggio *<textarea name="message" required minlength="10" maxlength="3000"></textarea></label><input class="hp" name="website" tabindex="-1" autocomplete="off"><label class="contact-privacy"><input type="checkbox" name="privacy_ack" required><span>Ho preso visione dell'informativa privacy e autorizzo l'uso dei dati per rispondere a questo messaggio. *</span></label><div id="contactResult" role="status" aria-live="polite" class="contact-result"></div><button class="contact-submit" type="submit">Invia messaggio</button></form></div></main><script>
document.getElementById('contactForm').addEventListener('submit',async event=>{event.preventDefault();const form=event.currentTarget,button=form.querySelector('button[type=submit]'),result=document.getElementById('contactResult'),fd=new FormData(form);button.disabled=true;button.textContent='Invio in corso…';result.className='contact-result';try{const data=Object.fromEntries(fd.entries());data.privacy_ack=fd.has('privacy_ack');const response=await fetch('/api/contact',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});const answer=await response.json();if(!response.ok)throw new Error(answer.error||'Invio non riuscito');result.className='contact-result ok';result.textContent='Messaggio inviato. Ti risponderemo via email.';form.reset()}catch(error){result.className='contact-result err';result.textContent=error.message||'Impossibile inviare il messaggio.'}finally{button.disabled=false;button.textContent='Invia messaggio'}});
</script></body></html>
